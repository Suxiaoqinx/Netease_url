<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易云音乐工具箱</title>
    <link href="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/twitter-bootstrap/5.1.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/aplayer/1.10.1/APlayer.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            color: #333;
        }
        .container {
            max-width: 800px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .btn-primary {
            margin-top: 20px;
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }
        .btn-success {
            margin-top: 20px;
            background-color: #28a745;
            border-color: #28a745;
        }
        .btn-success:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }
        .btn-warning {
            margin-top: 20px;
            background-color: #ffc107;
            border-color: #ffc107;
        }
        .btn-warning:hover {
            background-color: #e0a800;
            border-color: #d39e00;
        }
        #song-info {
            margin-top: 20px;
        }
        #song-info img {
            max-width: 100%;
            border-radius: 8px;
        }
        .alert-info {
            background-color: #d1ecf1;
            color: #0c5460;
            border-color: #bee5eb;
        }
        /* 歌曲/歌单标题过长自动省略号 */
        .song-title, .playlist-title {
            display: inline-block;
            max-width: 180px;
            vertical-align: middle;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 歌单列表按钮不换行 */
        .list-group-item .select-song {
            flex-shrink: 0;
            margin-left: 10px;
        }
        /* 歌词区域美化 */
        .lyric-box {
            max-height: 180px;
            overflow-y: auto;
            background: linear-gradient(90deg,#f7f7fa 60%,#f0f4fa 100%);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 15px;
            color: #222;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            line-height: 1.7;
            margin-bottom: 0;
        }
        /* 批量下载面板 */
        .batch-track-list {
            max-height: 340px;
            overflow-y: auto;
            border-top: 1px solid #eee;
        }
        .batch-track .batch-track-progress {
            height: 4px;
            background-color: #e9ecef;
        }
        .batch-track .batch-track-progress .progress-bar {
            transition: width .3s ease;
        }
        .batch-track .batch-track-link {
            flex-shrink: 0;
        }
        #playlist-result .batch-controls,
        #album-result .batch-controls {
            row-gap: .5rem;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">网易云音乐工具箱</h1>
        <div class="card shadow-sm">
            <div class="card-body">
                <form id="main-form">
                    <div class="mb-3">
                        <label class="form-label">功能选择</label>
                        <select id="mode-select" class="form-select">
                            <option value="search">歌曲搜索</option>
                            <option value="parse">单曲解析</option>
                            <option value="playlist">歌单解析</option>
                            <option value="album">专辑解析</option>
                            <option value="download">音乐下载</option>
                        </select>
                    </div>
                    <div id="search-area">
                        <div class="mb-3">
                            <label for="search_keywords" class="form-label">搜索关键词</label>
                            <input type="text" id="search_keywords" class="form-control" placeholder="输入关键词进行搜索">
                        </div>
                        <div class="mb-3">
                            <label for="search_limit" class="form-label">返回数量</label>
                            <input type="number" id="search_limit" class="form-control" value="10" min="1" max="50">
                        </div>
                        <div class="text-center">
                            <button type="button" id="search-btn" class="btn btn-success w-50">搜索</button>
                        </div>
                    </div>
                    <div id="parse-area" style="display:none;">
                        <div class="mb-3">
                            <label for="song_ids" class="form-label">歌曲ID或URL</label>
                            <input type="text" id="song_ids" class="form-control" placeholder="输入歌曲ID或URL">
                        </div>
                        <div class="mb-3">
                            <label for="level" class="form-label">音质选择</label>
                            <select id="level" class="form-select">
                                <option value="standard">标准音质</option>
                                <option value="exhigh">极高音质</option>
                                <option value="lossless">无损音质</option>
                                <option value="hires">Hires音质</option>
                                <option value="sky">沉浸环绕声</option>
                                <option value="jyeffect">高清环绕声</option>
                                <option value="jymaster">超清母带</option>

                            </select>
                        </div>
                        <div class="text-center">
                            <button type="button" id="parse-btn" class="btn btn-primary w-50">解析</button>
                        </div>
                    </div>
                    <div id="playlist-area" style="display:none;">
                        <div class="mb-3">
                            <label for="playlist_id" class="form-label">歌单ID或链接</label>
                            <input type="text" id="playlist_id" class="form-control" placeholder="输入歌单ID或网易云歌单链接">
                        </div>
                        <div class="text-center">
                            <button type="button" id="playlist-btn" class="btn btn-warning w-50">解析歌单</button>
                        </div>
                    </div>
                    <div id="album-area" style="display:none;">
                        <div class="mb-3">
                            <label for="album_id" class="form-label">专辑ID或链接</label>
                            <input type="text" id="album_id" class="form-control" placeholder="输入专辑ID或网易云专辑链接">
                        </div>
                        <div class="text-center">
                            <button type="button" id="album-btn" class="btn btn-info w-50">解析专辑</button>
                        </div>
                    </div>
                    <div id="download-area" style="display:none;">
                        <div class="mb-3">
                            <label for="download_id" class="form-label">音乐ID或URL</label>
                            <input type="text" id="download_id" class="form-control" placeholder="输入音乐ID或网易云音乐链接">
                        </div>
                        <div class="mb-3">
                            <label for="download_quality" class="form-label">下载音质</label>
                            <select id="download_quality" class="form-select">
                                <option value="standard">标准音质</option>
                                <option value="exhigh">极高音质</option>
                                <option value="lossless" selected>无损音质</option>
                                <option value="hires">Hires音质</option>
                                <option value="sky">沉浸环绕声</option>
                                <option value="jyeffect">高清环绕声</option>
                                <option value="jymaster">超清母带</option>
                                <option value="dolby">杜比全景声</option>
                            </select>
                        </div>
                        <div class="text-center">
                            <button type="button" id="download-btn" class="btn btn-success w-50">下载音乐</button>
                        </div>
                        <div id="download-progress" class="mt-3 d-none">
                            <div class="progress">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar" style="width: 100%"></div>
                            </div>
                            <div class="text-center mt-2">
                                <small class="text-muted">正在下载并写入元信息...</small>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <!-- 搜索结果列表 -->
        <div id="search-result" class="mt-4 d-none">
            <h5>搜索结果：</h5>
            <ul class="list-group" id="search-list"></ul>
        </div>
        <!-- 结果展示区域 -->
        <div id="song-info" class="alert alert-info d-none mt-4 p-0 border-0" style="box-shadow:0 2px 8px rgba(0,0,0,0.07);">
            <div class="row g-0 align-items-stretch">
                <div class="col-md-8 p-3 d-flex flex-column justify-content-between">
                    <h4 class="mb-2" id="song_name" style="font-weight:700;"></h4>
                    <div class="mb-2"><span class="badge bg-primary me-2">歌手</span><span id="artist_names"></span></div>
                    <div class="mb-2"><span class="badge bg-secondary me-2">专辑</span><span id="song_alname"></span></div>
                    <div class="mb-2"><span class="badge bg-success me-2">音质</span><span id="song_level"></span></div>
                    <div class="mb-2"><span class="badge bg-warning text-dark me-2">大小</span><span id="song_size"></span></div>
                    <div class="mb-2">
                        <button id="show-big-pic" type="button" class="btn btn-outline-info btn-sm me-2" style="vertical-align:middle;">显示大图</button>
                    </div>
                    <div class="mb-2"><span class="badge bg-info text-dark me-2">链接</span><a id="song_url" href="" target="_blank">点击下载</a></div>
                    <div class="mb-2"><span class="badge bg-dark me-2">歌词</span></div>
                    <div class="lyric-box" id="lyric"></div>
                </div>
            </div>
            <div class="row g-0">
                <div class="col-12 p-3 pt-0">
                    <div id="aplayer"></div>
                </div>
            </div>
        </div>
        <!-- 歌单解析结果 -->
        <div id="playlist-result" class="mt-4 d-none">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-3">
                        <img id="playlist-cover" src="" alt="cover" style="width:60px;height:60px;object-fit:cover;border-radius:8px;margin-right:15px;">
                        <div>
                            <h5 id="playlist-name" class="mb-1"></h5>
                            <div class="text-muted" id="playlist-creator"></div>
                        </div>
                    </div>
                    <div id="playlist-desc" class="mb-2 text-secondary small"></div>
                    <div>共 <span id="playlist-count"></span> 首歌</div>
                    <div class="d-flex flex-wrap align-items-center gap-2 mt-3 pt-2 border-top batch-controls">
                        <div class="form-check me-2">
                            <input class="form-check-input" type="checkbox" id="playlist-select-all" checked>
                            <label class="form-check-label" for="playlist-select-all">全选</label>
                        </div>
                        <select id="playlist-quality" class="form-select form-select-sm" style="width:auto;" title="批量下载音质">
                            <option value="standard">标准音质</option>
                            <option value="exhigh">极高音质</option>
                            <option value="lossless" selected>无损音质</option>
                            <option value="hires">Hires音质</option>
                            <option value="sky">沉浸环绕声</option>
                            <option value="jyeffect">高清环绕声</option>
                            <option value="jymaster">超清母带</option>
                            <option value="dolby">杜比全景声</option>
                        </select>
                        <button type="button" id="playlist-download-all" class="btn btn-sm btn-success">批量下载全部</button>
                        <button type="button" id="playlist-download-selected" class="btn btn-sm btn-outline-success">下载选中</button>
                    </div>
                </div>
            </div>
            <ul class="list-group mt-3" id="playlist-tracks"></ul>
        </div>
        <!-- 专辑解析结果 -->
        <div id="album-result" class="mt-4 d-none">
            <div class="card">
                <div class="card-body">
                    <div class="d-flex align-items-center mb-3">
                        <img id="album-cover" src="" alt="cover" style="width:60px;height:60px;object-fit:cover;border-radius:8px;margin-right:15px;">
                        <div>
                            <h5 id="album-name" class="mb-1"></h5>
                            <div class="text-muted" id="album-artist"></div>
                        </div>
                    </div>
                    <div id="album-desc" class="mb-2 text-secondary small"></div>
                    <div>共 <span id="album-count"></span> 首歌</div>
                    <div class="d-flex flex-wrap align-items-center gap-2 mt-3 pt-2 border-top batch-controls">
                        <div class="form-check me-2">
                            <input class="form-check-input" type="checkbox" id="album-select-all" checked>
                            <label class="form-check-label" for="album-select-all">全选</label>
                        </div>
                        <select id="album-quality" class="form-select form-select-sm" style="width:auto;" title="批量下载音质">
                            <option value="standard">标准音质</option>
                            <option value="exhigh">极高音质</option>
                            <option value="lossless" selected>无损音质</option>
                            <option value="hires">Hires音质</option>
                            <option value="sky">沉浸环绕声</option>
                            <option value="jyeffect">高清环绕声</option>
                            <option value="jymaster">超清母带</option>
                            <option value="dolby">杜比全景声</option>
                        </select>
                        <button type="button" id="album-download-all" class="btn btn-sm btn-success">批量下载全部</button>
                        <button type="button" id="album-download-selected" class="btn btn-sm btn-outline-success">下载选中</button>

            <ul class="list-group mt-3" id="album-tracks"></ul>
        </div>
        <!-- 批量下载进度面板 -->
        <div id="batch-panel" class="mt-4 d-none">
            <div class="card border-success shadow-sm">
                <div class="card-header bg-success text-white d-flex justify-content-between align-items-center">
                    <span class="text-truncate me-2">批量下载：<strong id="batch-name"></strong></span>
                    <span id="batch-status-badge" class="badge bg-light text-dark flex-shrink-0">准备中</span>
                </div>
                <div class="card-body">
                    <div class="progress mb-2" style="height:22px;">
                        <div id="batch-progress-bar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" role="progressbar" style="width:0%;">0%</div>
                    </div>
                    <div class="small text-muted mb-2" id="batch-summary">正在创建任务...</div>
                    <div class="d-flex flex-wrap gap-2 mb-3">
                        <button type="button" id="batch-zip-btn" class="btn btn-sm btn-primary d-none">打包下载已完成文件（ZIP）</button>
                        <button type="button" id="batch-cancel-btn" class="btn btn-sm btn-outline-danger">取消下载</button>
                    </div>
                    <div id="batch-tracks" class="batch-track-list"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal for big picture -->
    <div class="modal fade" id="bigPicModal" tabindex="-1" aria-labelledby="bigPicModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="bigPicModalLabel">大图预览</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="big-pic-img" src="" alt="大图" style="max-width:100%;max-height:60vh;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,0.12);">
                </div>
            </div>
        </div>
    </div>
    <footer class="footer mt-5 py-3 bg-light border-top">
        <div class="container text-center text-muted small">
            <span>网易云音乐工具箱 &copy; 2025 | Powered by Suxiaoqingx &amp; Bootstrap | <a href="https://github.com/Suxiaoqinx/Netease_url" target="_blank">GitHub</a></span>
        </div>
    </footer>
    <script src="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/aplayer/1.10.1/APlayer.min.js"></script>
    <script src="https://mirrors.sustech.edu.cn/cdnjs/ajax/libs/twitter-bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function() {
            // ===== 批量下载状态 =====
            let playlistTracks = [];
            let albumTracks = [];
            let currentBatchJobId = null;
            let batchPollTimer = null;
            let batchPollFailures = 0;
            let batchZipBusy = false;

            function escapeHtml(text) {
                return String(text == null ? '' : text)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function lrctrim(lyrics) {
                const lines = lyrics.split('\n');
                const data = [];

                lines.forEach((line, index) => {
                    const matches = line.match(/\[(\d{2}):(\d{2}[\.:]?\d*)]/);
                    if (matches) {
                        const minutes = parseInt(matches[1], 10);
                        const seconds = parseFloat(matches[2].replace('.', ':')) || 0;
                        const timestamp = minutes * 60000 + seconds * 1000;

                        let text = line.replace(/\[\d{2}:\d{2}[\.:]?\d*\]/g, '').trim();
                        text = text.replace(/\s\s+/g, ' '); // Replace multiple spaces with a single space

                        data.push([timestamp, index, text]);
                    }
                });

                data.sort((a, b) => a[0] - b[0]);

                return data;
            }

            function lrctran(lyric, tlyric) {
                lyric = lrctrim(lyric);
                tlyric = lrctrim(tlyric);

                let len1 = lyric.length;
                let len2 = tlyric.length;
                let result = "";

                for (let i = 0, j = 0; i < len1 && j < len2; i++) {
                    while (lyric[i][0] > tlyric[j][0] && j + 1 < len2) {
                        j++;
                    }

                    if (lyric[i][0] === tlyric[j][0]) {
                        tlyric[j][2] = tlyric[j][2].replace('/', '');
                        if (tlyric[j][2]) {
                            lyric[i][2] += ` (翻译：${tlyric[j][2]})`;
                        }
                        j++;
                    }
                }

                for (let i = 0; i < len1; i++) {
                    let t = lyric[i][0];
                    result += `[${String(Math.floor(t / 60000)).padStart(2, '0')}:${String(Math.floor((t % 60000) / 1000)).padStart(2, '0')}.${String(t % 1000).padStart(3, '0')}]${lyric[i][2]}\n`;
                }

                return result;
            }

            function extractLinks(text) {
                var regex = /https?:\/\/\S+/g;
                var matches = text.match(regex);
                if (matches) {
                    return matches[0];
                } else {
                    return '';
                }
            }
    
            function checkValidLink(link) {
                if (link.indexOf("http") === -1 || 
                    (link.indexOf("music.163.com") === -1 && link.indexOf("163cn.tv") === -1)) {
                    return false;
                }
                return true;
            }
    
            function extractAndCheckId(text) {
                var link = extractLinks(text);
                if (checkValidLink(link)) {
                    return link;
                } else {
                    var idRegex = /\b\d+\b/g;
                    var ids = text.match(idRegex);
                    if (ids && ids.length > 0) {
                        return ids[0];
                    }
                    return '';
                }
            }

            // 切换功能区
            $('#mode-select').on('change', function() {
                if ($(this).val() === 'search') {
                    $('#search-area').show();
                    $('#parse-area').hide();
                    $('#playlist-area').hide();
                    $('#album-area').hide();
                    $('#download-area').hide();
                    $('#song-info').addClass('d-none');
                    $('#playlist-result').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else if ($(this).val() === 'parse') {
                    $('#search-area').hide();
                    $('#parse-area').show();
                    $('#playlist-area').hide();
                    $('#album-area').hide();
                    $('#download-area').hide();
                    $('#search-result').addClass('d-none');
                    $('#playlist-result').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else if ($(this).val() === 'playlist') {
                    $('#search-area').hide();
                    $('#parse-area').hide();
                    $('#playlist-area').show();
                    $('#album-area').hide();
                    $('#download-area').hide();
                    $('#search-result').addClass('d-none');
                    $('#song-info').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else if ($(this).val() === 'album') {
                    $('#search-area').hide();
                    $('#parse-area').hide();
                    $('#playlist-area').hide();
                    $('#album-area').show();
                    $('#download-area').hide();
                    $('#search-result').addClass('d-none');
                    $('#song-info').addClass('d-none');
                    $('#playlist-result').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else if ($(this).val() === 'download') {
                    $('#search-area').hide();
                    $('#parse-area').hide();
                    $('#playlist-area').hide();
                    $('#album-area').hide();
                    $('#download-area').show();
                    $('#search-result').addClass('d-none');
                    $('#song-info').addClass('d-none');
                    $('#playlist-result').addClass('d-none');
                    $('#album-result').addClass('d-none');
                } else {
                    $('#album-area').hide();
                    $('#download-area').hide();
                    $('#album-result').addClass('d-none');
                }
            });

            // 搜索功能
            $('#search-btn').on('click', function() {
                const keywords = $('#search_keywords').val();
                const limit = $('#search_limit').val();
                if (!keywords) {
                    alert('请输入搜索关键词');
                    return;
                }
                $.ajax({
                    url: '/Search',
                    method: 'POST',
                    data: { keyword: keywords, limit: limit },
                    dataType: 'json',
                    success: function(data) {
                        if (data.status === 200) {
                            $('#search-list').empty();
                            data.data.forEach(function(song) {
                                const item = `<li class="list-group-item d-flex justify-content-between align-items-center">
                                    <div>
                                        <img src="${song.picUrl}" alt="cover" style="width:40px;height:40px;object-fit:cover;border-radius:4px;margin-right:10px;">
                                        <strong class='song-title'>${song.name}</strong> - <span>${song.artists}</span> <span class="text-muted">[${song.album}]</span>
                                    </div>
                                    <div>
                                        <button class="btn btn-sm btn-outline-primary select-song me-2" data-id="${song.id}" data-name="${song.name}">解析</button>
                                        <button class="btn btn-sm btn-success download-song" data-id="${song.id}" data-name="${song.name}">下载</button>
                                    </div>
                                </li>`;
                                $('#search-list').append(item);
                            });
                            $('#search-result').removeClass('d-none');
                        } else {
                            $('#search-list').html('<li class="list-group-item">未找到相关歌曲</li>');
                            $('#search-result').removeClass('d-none');
                        }
                    },
                    error: function() {
                        $('#search-list').html('<li class="list-group-item">搜索失败，请重试</li>');
                        $('#search-result').removeClass('d-none');
                    }
                });
            });

            // 搜索结果点击解析
            $(document).on('click', '.select-song', function() {
                const songId = $(this).data('id');
                $('#song_ids').val(songId);
                $('#mode-select').val('parse').trigger('change');
                $('html,body').animate({scrollTop: $('#main-form').offset().top}, 300);
            });

            // 单曲解析
            $('#parse-btn').on('click', function() {
                const songIds = $('#song_ids').val();
                const level = $('#level').val();
                if (!songIds) {
                    alert('请输入歌曲ID或URL');
                    return;
                }
                $.post('/Song_V1', { url: songIds, level: level, type:'json' }, function(data) {
                    if (data.status === 200) {
                        $('#song_name').text(data.data.name);
                        $('#artist_names').text(data.data.ar_name);
                        $('#song_alname').text(data.data.al_name);
                        $('#song_level').text(data.data.level);
                        $('#song_size').text(data.data.size);
                        let processedLyrics = data.data.lyric;
                        if (data.data.tlyric) {
                            processedLyrics = lrctran(data.data.lyric, data.data.tlyric);
                        }
                        $('#lyric').html(processedLyrics.replace(/\n/g, '<br>'));
                        $('#song_url').attr('href', data.data.url).text('点击下载');
                        $('#song-info').removeClass('d-none');
                        $('#show-big-pic').data('pic', data.data.pic);
                        new APlayer({
                            container: document.getElementById('aplayer'),
                            lrcType: 1,
                            audio: [{
                                name: data.data.name,
                                artist: data.data.ar_name,
                                url: data.data.url,
                                cover: data.data.pic,
                                lrc: processedLyrics
                            }]
                        });
                    } else {
                        alert(data.data.msg);
                    }
                }, 'json');
            });

            // 显示大图按钮事件
            $(document).on('click', '#show-big-pic', function() {
                var picUrl = $(this).data('pic');
                $('#big-pic-img').attr('src', picUrl);
                var modal = new bootstrap.Modal(document.getElementById('bigPicModal'));
                modal.show();
            });

            // 歌单解析
            $('#playlist-btn').on('click', function() {
                let pid = $('#playlist_id').val().trim();
                if (!pid) {
                    alert('请输入歌单ID或链接');
                    return;
                }
                // 支持直接粘贴歌单链接
                const idMatch = pid.match(/playlist\?id=(\d+)/);
                if (idMatch) pid = idMatch[1];
                $.get('/Playlist', { id: pid }, function(data) {
                    if (data.status === 200) {
                        const pl = data.data.playlist;
                        $('#playlist-cover').attr('src', pl.coverImgUrl);
                        $('#playlist-name').text(pl.name);
                        $('#playlist-creator').text('by ' + pl.creator);
                        $('#playlist-desc').text(pl.description || '');
                        $('#playlist-count').text(pl.trackCount);
                        $('#playlist-tracks').empty();
                        playlistTracks = pl.tracks || [];
                        $('#playlist-select-all').prop('checked', true);
                        playlistTracks.forEach(function(song, idx) {
                            const item = `<li class="list-group-item d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center" style="min-width:0;">
                                    <input class="form-check-input batch-checkbox me-2 flex-shrink-0" type="checkbox" data-index="${idx}" checked>
                                    <img src="${escapeHtml(song.picUrl)}" alt="cover" style="width:32px;height:32px;object-fit:cover;border-radius:4px;margin-right:8px;">
                                    <strong class="playlist-title">${idx+1}. ${escapeHtml(song.name)}</strong> - <span>${escapeHtml(song.artists)}</span> <span class="text-muted">[${escapeHtml(song.album)}]</span>
                                </div>
                                <div class="flex-shrink-0">
                                    <button class="btn btn-sm btn-outline-primary select-song me-2" data-id="${song.id}">解析</button>
                                    <button class="btn btn-sm btn-success download-song" data-id="${song.id}">下载</button>
                                </div>
                            </li>`;
                            $('#playlist-tracks').append(item);
                        });
                        $('#playlist-result').removeClass('d-none');
                    } else {
                        playlistTracks = [];
                        $('#playlist-result').removeClass('d-none');
                        $('#playlist-tracks').html('<li class="list-group-item">歌单解析失败：' + escapeHtml(data.message || (data.data && data.data.msg) || '未知错误') + '</li>');
                    }
                }, 'json');
            });

            // 专辑解析
            $(document).on('click', '#album-btn', function() {
                let aid = $('#album_id').val().trim();
                if (!aid) {
                    alert('请输入专辑ID或链接');
                    return;
                }
                // 支持直接粘贴专辑链接
                const idMatch = aid.match(/album\?id=(\d+)/);
                if (idMatch) aid = idMatch[1];
                $.get('/Album', { id: aid }, function(data) {
                    if (data.status === 200) {
                        const al = data.data.album;
                        $('#album-cover').attr('src', al.coverImgUrl);
                        $('#album-name').text(al.name);
                        $('#album-artist').text(al.artist);
                        $('#album-desc').text(al.description || '');
                        $('#album-count').text(al.songs.length);
                        $('#album-tracks').empty();
                        albumTracks = al.songs || [];
                        $('#album-select-all').prop('checked', true);
                        albumTracks.forEach(function(song, idx) {
                            const item = `<li class="list-group-item d-flex justify-content-between align-items-center">
                                <div class="d-flex align-items-center" style="min-width:0;">
                                    <input class="form-check-input batch-checkbox me-2 flex-shrink-0" type="checkbox" data-index="${idx}" checked>
                                    <img src="${escapeHtml(song.picUrl)}" alt="cover" style="width:32px;height:32px;object-fit:cover;border-radius:4px;margin-right:8px;">
                                    <strong class="playlist-title">${idx+1}. ${escapeHtml(song.name)}</strong> - <span>${escapeHtml(song.artists)}</span> <span class="text-muted">[${escapeHtml(song.album)}]</span>
                                </div>
                                <div class="flex-shrink-0">
                                    <button class="btn btn-sm btn-outline-primary select-song me-2" data-id="${song.id}">解析</button>
                                    <button class="btn btn-sm btn-success download-song" data-id="${song.id}">下载</button>
                                </div>
                            </li>`;
                            $('#album-tracks').append(item);
                        });
                        $('#album-result').removeClass('d-none');
                    } else {
                        albumTracks = [];
                        $('#album-result').removeClass('d-none');
                        $('#album-tracks').html('<li class="list-group-item">专辑解析失败：' + escapeHtml(data.message || (data.data && data.data.msg) || '未知错误') + '</li>');
                    }
                }, 'json');
            });

            // 音乐下载功能
            $('#download-btn').on('click', function() {
                const musicId = $('#download_id').val().trim();
                const quality = $('#download_quality').val();
                
                if (!musicId) {
                    alert('请输入音乐ID或URL');
                    return;
                }
                
                // 提取ID（支持URL格式）
                let processedId = musicId;
                const idMatch = musicId.match(/song\?id=(\d+)/);
                if (idMatch) {
                    processedId = idMatch[1];
                }
                
                // 显示进度条
                $('#download-progress').removeClass('d-none');
                $('#download-btn').prop('disabled', true).text('下载中...');
                
                // 使用XMLHttpRequest来处理下载并获取响应头
                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/Download', true);
                xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
                xhr.responseType = 'blob';
                
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        // 获取自定义响应头
                        const downloadMessage = xhr.getResponseHeader('X-Download-Message');
                        const encodedFilename = xhr.getResponseHeader('X-Download-Filename');
                        const filename = encodedFilename ? decodeURIComponent(encodedFilename) : 'music.flac';
                        
                        // 创建下载链接
                        const blob = xhr.response;
                        const url = window.URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = filename || 'music.flac';
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        window.URL.revokeObjectURL(url);
                        
                        // 显示完成提示
                        alert('✅ 音乐文件下载完成！');
                        console.log(`下载完成: ${filename}`);
                        if (downloadMessage) {
                            console.log(`服务器消息: ${downloadMessage}`);
                        }
                    } else {
                        alert('下载失败，请重试');
                    }
                    
                    // 重置按钮状态
                    $('#download-progress').addClass('d-none');
                    $('#download-btn').prop('disabled', false).text('下载音乐');
                };
                
                xhr.onerror = function() {
                    alert('下载出错，请重试');
                    $('#download-progress').addClass('d-none');
                    $('#download-btn').prop('disabled', false).text('下载音乐');
                };
                
                // 发送请求
                const formData = `id=${encodeURIComponent(processedId)}&quality=${encodeURIComponent(quality)}`;
                xhr.send(formData);
            });

            // 列表中的下载按钮点击事件
            // 下载按钮点击跳转到下载功能
            $(document).on('click', '.download-song', function() {
                const musicId = $(this).data('id');
                const songName = $(this).data('name');
                
                if (!musicId) {
                    alert('无法获取音乐ID');
                    return;
                }
                
                // 填充下载ID并跳转到下载功能区域
                $('#download_id').val(musicId);
                $('#mode-select').val('download').trigger('change');
                $('html,body').animate({scrollTop: $('#main-form').offset().top}, 300);
            });

            // ==================== 批量下载 ====================

            const batchJobStatus = {
                pending: ['等待中', 'bg-secondary'],
                running: ['下载中', 'bg-info text-dark'],
                cancelling: ['取消中', 'bg-warning text-dark'],
                completed: ['已完成', 'bg-success'],
                cancelled: ['已取消', 'bg-warning text-dark'],
                failed: ['失败', 'bg-danger']
            };

            const batchTrackStatus = {
                pending: ['等待', 'bg-secondary'],
                downloading: ['下载中', 'bg-info text-dark'],
                success: ['完成', 'bg-success'],
                skipped: ['已存在', 'bg-secondary'],
                failed: ['失败', 'bg-danger'],
                cancelled: ['已取消', 'bg-warning text-dark']
            };

            function startBatchDownload(kind, onlySelected) {
                const allTracks = kind === 'playlist' ? playlistTracks : albumTracks;
                const containerSel = kind === 'playlist' ? '#playlist-tracks' : '#album-tracks';
                let chosen = allTracks.slice();

                if (onlySelected) {
                    chosen = [];
                    $(containerSel + ' .batch-checkbox:checked').each(function() {
                        const idx = parseInt($(this).attr('data-index'), 10);
                        if (!isNaN(idx) && allTracks[idx]) {
                            chosen.push(allTracks[idx]);
                        }
                    });
                }

                if (!chosen.length) {
                    alert('请至少选择一首歌曲');
                    return;
                }

                const quality = $('#' + kind + '-quality').val() || 'lossless';
                const name = kind === 'playlist'
                    ? ($('#playlist-name').text() || '歌单批量下载')
                    : ($('#album-name').text() || '专辑批量下载');

                if (batchPollTimer) {
                    clearTimeout(batchPollTimer);
                    batchPollTimer = null;
                }
                batchPollFailures = 0;
                currentBatchJobId = null;

                $('#batch-panel').removeClass('d-none');
                $('#batch-name').text(name);
                $('#batch-status-badge').attr('class', 'badge bg-secondary flex-shrink-0').text('创建中');
                $('#batch-progress-bar')
                    .attr('class', 'progress-bar progress-bar-striped progress-bar-animated bg-success')
                    .css('width', '0%').text('0%');
                $('#batch-summary').text('正在提交 ' + chosen.length + ' 首歌曲...');
                $('#batch-tracks').empty();
                $('#batch-zip-btn').addClass('d-none');
                $('#batch-cancel-btn').prop('disabled', false).text('取消下载');
                $('html,body').animate({scrollTop: $('#batch-panel').offset().top - 20}, 300);

                $.ajax({
                    url: '/batch/download',
                    method: 'POST',
                    contentType: 'application/json',
                    dataType: 'json',
                    data: JSON.stringify({
                        type: 'tracks',
                        tracks: chosen,
                        quality: quality,
                        name: name,
                        fallback: true
                    })
                }).done(function(res) {
                    if (res && res.status === 200 && res.data && res.data.job_id) {
                        currentBatchJobId = res.data.job_id;
                        renderBatch(res.data);
                        pollBatch(res.data.job_id);
                    } else {
                        $('#batch-summary').text('创建任务失败：' + ((res && res.message) || '未知错误'));
                        $('#batch-status-badge').attr('class', 'badge bg-danger flex-shrink-0').text('失败');
                        $('#batch-cancel-btn').prop('disabled', true);
                    }
                }).fail(function(xhr) {
                    let message = '创建任务失败，请重试';
                    try {
                        const body = JSON.parse(xhr.responseText);
                        if (body && body.message) message = body.message;
                    } catch (e) { /* ignore */ }
                    $('#batch-summary').text(message);
                    $('#batch-status-badge').attr('class', 'badge bg-danger flex-shrink-0').text('失败');
                    $('#batch-cancel-btn').prop('disabled', true);
                });
            }

            function renderBatch(job) {
                const tracks = job.tracks || [];

                // 曲目数量变化时重建列表，其余情况原地更新，避免闪烁
                if ($('#batch-tracks .batch-track').length !== tracks.length) {
                    $('#batch-tracks').empty();
                    tracks.forEach(function(track) {
                        const $row = $('<div class="batch-track d-flex align-items-center py-1">')
                            .attr('data-index', track.index);

                        $row.append(
                            $('<span class="batch-track-index text-muted small me-2 flex-shrink-0">')
                                .text((track.index + 1) + '.')
                                .css('min-width', '2.6em')
                        );

                        const $info = $('<div class="flex-grow-1 me-2" style="min-width:0;">');
                        const $title = $('<div class="text-truncate">');
                        $title.append($('<span class="batch-track-name fw-semibold">').text(track.name || ''));
                        $title.append(document.createTextNode(' '));
                        $title.append($('<span class="batch-track-artist text-muted small">').text(track.artists || ''));
                        $info.append($title);
                        $info.append(
                            $('<div class="progress batch-track-progress mt-1">')
                                .append($('<div class="progress-bar bg-info" style="width:0%;">'))
                        );
                        $info.append($('<div class="batch-track-error text-danger small text-truncate">'));

                        $row.append($info);
                        $row.append(
                            $('<span class="badge batch-track-status bg-secondary flex-shrink-0">').text('等待')
                        );
                        $row.append(
                            $('<a class="batch-track-link btn btn-sm btn-outline-primary ms-2 flex-shrink-0 d-none">')
                                .text('下载')
                        );
                        $('#batch-tracks').append($row);
                    });
                }

                tracks.forEach(function(track) {
                    const $row = $('#batch-tracks .batch-track[data-index="' + track.index + '"]');
                    if (!$row.length) return;

                    const info = batchTrackStatus[track.status] || [track.status, 'bg-secondary'];
                    $row.find('.batch-track-status')
                        .attr('class', 'badge batch-track-status flex-shrink-0 ' + info[1])
                        .text(info[0]);

                    if (track.name) $row.find('.batch-track-name').text(track.name);
                    $row.find('.batch-track-artist').text(track.artists || '');

                    let barColor = 'bg-info';
                    if (track.status === 'success' || track.status === 'skipped') barColor = 'bg-success';
                    else if (track.status === 'failed') barColor = 'bg-danger';
                    else if (track.status === 'cancelled') barColor = 'bg-warning';

                    $row.find('.batch-track-progress .progress-bar')
                        .attr('class', 'progress-bar ' + barColor)
                        .css('width', Number(track.progress || 0) + '%');

                    $row.find('.batch-track-error')
                        .text(track.status === 'failed' ? (track.error || '下载失败') : '');

                    const $link = $row.find('.batch-track-link');
                    if (track.file_url && (track.status === 'success' || track.status === 'skipped')) {
                        $link.removeClass('d-none').attr('href', track.file_url);
                    } else {
                        $link.addClass('d-none').attr('href', '#');
                    }
                });

                const jobInfo = batchJobStatus[job.status] || [job.status, 'bg-secondary'];
                $('#batch-status-badge')
                    .attr('class', 'badge flex-shrink-0 ' + jobInfo[1])
                    .text(jobInfo[0]);

                const progress = Number(job.progress || 0);
                const finished = ['completed', 'cancelled', 'failed'].indexOf(job.status) !== -1;
                const progressColor = job.status === 'failed'
                    ? 'bg-danger'
                    : (job.status === 'cancelled' ? 'bg-warning' : 'bg-success');
                $('#batch-progress-bar')
                    .attr('class', 'progress-bar ' + (finished ? '' : 'progress-bar-striped progress-bar-animated ') + progressColor)
                    .css('width', progress + '%')
                    .text(progress.toFixed(0) + '%');

                const successCount = Number(job.success || 0) + Number(job.skipped || 0);
                $('#batch-summary').text(
                    '共 ' + job.total + ' 首 | 成功 ' + job.success +
                    ' | 已存在 ' + job.skipped +
                    ' | 失败 ' + job.failed +
                    ' | 取消 ' + job.cancelled +
                    (job.downloading ? ' | 正在下载 ' + job.downloading + ' 首' : '')
                );

                $('#batch-zip-btn').toggleClass('d-none', successCount <= 0);
                $('#batch-cancel-btn').prop('disabled', finished).text('取消下载');
            }

            function pollBatch(jobId) {
                if (batchPollTimer) {
                    clearTimeout(batchPollTimer);
                    batchPollTimer = null;
                }

                $.ajax({
                    url: '/batch/status/' + encodeURIComponent(jobId),
                    method: 'GET',
                    dataType: 'json',
                    cache: false
                }).done(function(res) {
                    if (!res || res.status !== 200 || !res.data) {
                        $('#batch-summary').text('获取任务状态失败：' + ((res && res.message) || '未知错误'));
                        $('#batch-status-badge').attr('class', 'badge bg-danger flex-shrink-0').text('失败');
                        return;
                    }

                    batchPollFailures = 0;
                    renderBatch(res.data);

                    if (['completed', 'cancelled', 'failed'].indexOf(res.data.status) === -1) {
                        batchPollTimer = setTimeout(function() {
                            pollBatch(jobId);
                        }, 1000);
                    }
                }).fail(function() {
                    batchPollFailures += 1;
                    if (batchPollFailures > 5) {
                        $('#batch-summary').text('无法连接服务器，已停止刷新进度（下载任务可能仍在后台进行）');
                        return;
                    }
                    batchPollTimer = setTimeout(function() {
                        pollBatch(jobId);
                    }, 2000);
                });
            }

            // 全选 / 反选
            $('#playlist-select-all').on('change', function() {
                $('#playlist-tracks .batch-checkbox').prop('checked', this.checked);
            });
            $('#album-select-all').on('change', function() {
                $('#album-tracks .batch-checkbox').prop('checked', this.checked);
            });

            function syncSelectAll(kind) {
                const containerSel = kind === 'playlist' ? '#playlist-tracks' : '#album-tracks';
                const all = $(containerSel + ' .batch-checkbox').length;
                const checked = $(containerSel + ' .batch-checkbox:checked').length;
                $('#' + kind + '-select-all').prop('checked', all > 0 && all === checked);
            }

            $(document).on('change', '#playlist-tracks .batch-checkbox', function() {
                syncSelectAll('playlist');
            });
            $(document).on('change', '#album-tracks .batch-checkbox', function() {
                syncSelectAll('album');
            });

            // 批量下载按钮
            $('#playlist-download-all').on('click', function() {
                startBatchDownload('playlist', false);
            });
            $('#playlist-download-selected').on('click', function() {
                startBatchDownload('playlist', true);
            });
            $('#album-download-all').on('click', function() {
                startBatchDownload('album', false);
            });
            $('#album-download-selected').on('click', function() {
                startBatchDownload('album', true);
            });

            // 取消下载
            $('#batch-cancel-btn').on('click', function() {
                if (!currentBatchJobId) return;

                const $btn = $(this);
                $btn.prop('disabled', true).text('取消中...');

                $.ajax({
                    url: '/batch/cancel/' + encodeURIComponent(currentBatchJobId),
                    method: 'POST',
                    dataType: 'json'
                }).done(function(res) {
                    if (res && res.data) renderBatch(res.data);
                    if (res && res.message) $('#batch-summary').text(res.message);
                }).always(function() {
                    $btn.text('取消下载');
                });
            });

            // 打包下载已完成文件（流式 ZIP，不占用额外磁盘；按钮防重复点击）
            $('#batch-zip-btn').on('click', function() {
                if (!currentBatchJobId || batchZipBusy) return;

                const $btn = $(this);
                batchZipBusy = true;
                $btn.prop('disabled', true).text('正在打包下载...');

                window.location.href = '/batch/zip/' + encodeURIComponent(currentBatchJobId);

                setTimeout(function() {
                    batchZipBusy = false;
                    $btn.prop('disabled', false).text('打包下载已完成文件（ZIP）');
                }, 10000);
            });
        });
    </script>
</body>
</html>
